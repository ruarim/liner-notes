<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Researcher</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div id="login-section">
            <h1>Music Researcher</h1>
            <p>Connect to see your current track.</p>
            <a href="/login" class="btn">Login with Spotify</a>
        </div>

        <div id="player-section" class="hidden">
            <div class="player-layout">
                <div class="track-info">
                    <img id="album-art" src="" alt="Album Art">
                    <h2 id="track-name">Track Name</h2>
                    <p id="artist-name">Artist</p>
                    <p id="status">Updating...</p>
                </div>

                <div id="analysis-container">
                    <p id="analysis-text">Loading insights...</p>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
